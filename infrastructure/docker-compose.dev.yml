version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carafford_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carafford_user
      POSTGRES_PASSWORD: carafford_secret
      POSTGRES_DB: carafford_db
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carafford_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

volumes:
  dev_postgres_data:
  dev_redis_data:
